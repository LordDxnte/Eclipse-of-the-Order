name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name "Eclipse of the Order" --add-data "assets;assets" eclipse_of_the_order.py

      - name: Zip release
        run: |
          Compress-Archive -Path "dist\Eclipse of the Order.exe" -DestinationPath "Eclipse.of.the.Order.${{ github.ref_name }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Eclipse.of.the.Order.${{ github.ref_name }}.zip
          name: Eclipse of the Order ${{ github.ref_name }}
          body: |
            ## Eclipse of the Order ${{ github.ref_name }}
            
            Download the zip, extract, and run the exe.

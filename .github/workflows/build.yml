name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame
      - run: pyinstaller --onefile --windowed eclipse_of_the_order.py --name Eclipse_of_the_Order
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-build
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller pygame
      - run: pyinstaller --onefile --windowed eclipse_of_the_order.py --name Eclipse_of_the_Order
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-build
          path: dist/
